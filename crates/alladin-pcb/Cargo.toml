[package]
name = "alladin-pcb"
version.workspace = true
edition.workspace = true
license.workspace = true

# `alladin-pcb`: the interactive, correct-by-construction PCB editor --
# see the root README / docs/architecture.md and `src/main.rs`'s module
# doc comment for scope. Reuses the existing,
# already-tested `alladin-geom`/`alladin-core` (geometry + collision/
# clearance model), `alladin-render` (egui camera + draw calls), and
# `alladin-router`'s walkaround/shove search (interactive trace
# dragging, not autorouting) rather than duplicating any of it.
[dependencies]
alladin-core = { path = "../alladin-core" }
alladin-geom = { path = "../alladin-geom" }
alladin-gerber = { path = "../alladin-gerber" }
alladin-kicad-io = { path = "../alladin-kicad-io" }
alladin-render = { path = "../alladin-render" }
alladin-router = { path = "../alladin-router" }
clap = { workspace = true }
eframe = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rfd = "0.15"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5"
ureq = { version = "2", features = ["json", "tls"] }
rmcp = { version = "3.1.0", features = ["server", "macros", "transport-streamable-http-server"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "sync", "time"] }
axum = "0.8.9"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
alladin-sexpr = { path = "../alladin-sexpr" }
