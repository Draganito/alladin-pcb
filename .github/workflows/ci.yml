name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Native tests
        run: cargo test -p alladin-pcb

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: WASM check
        run: cargo check -p alladin-pcb --target wasm32-unknown-unknown
