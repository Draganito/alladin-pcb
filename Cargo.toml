[workspace]
resolver = "2"
members = [
    "crates/alladin-geom",
    "crates/alladin-core",
    "crates/alladin-gerber",
    "crates/alladin-render",
    "crates/alladin-pcb",
]

[workspace.package]
version = "0.3.0-beta.1"
edition = "2021"
license = "AGPL-3.0-only"
authors = ["Dragan Bojovic"]
repository = "https://github.com/Draganito/alladin-pcb"

[workspace.dependencies]
rstar = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
eframe = "0.35"
rustc-hash = "2"
rayon = "1"
i_overlay = "7.0.3"
